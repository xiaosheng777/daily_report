app:
  host: 0.0.0.0
  port: 8000
  secure_cookie: false
  allow_self_register: true
  seed_demo_users: true  # 仅在空库时创建 admin / admin123 管理员
  frontend_dir: ../frontend

daily_report_submission:
  enabled: true
  rollover_time: "09:00"

automatic_daily_duplicate:
  enabled: true
  run_at: "12:00"
  catch_up_on_start: true

task_runner:
  stale_heartbeat_seconds: 90
  shutdown_grace_seconds: 30
  poll_interval_seconds: 2

resource_monitor:
  enabled: true
  collector_url: http://daily-report-monitor:8010
  collector_host: 0.0.0.0
  collector_port: 8010
  sample_interval_seconds: 10
  retention_days: 7
  metrics_path: ../storage/resource_metrics.sqlite3
  docker_socket: /var/run/docker.sock
  host_proc_path: /host/proc
  storage_probe_path: ../storage
  container_allowlist:
    - daily-report-web
    - daily-report-backend
    - daily-report-worker
    - daily-report-monitor

storage:
  root_dir: ../storage
  submitted_reports_dir: submitted_reports
  artifacts_dir: artifacts
  testcase_snapshots_dir: testcase_snapshots
  tasks_dir: tasks
  exports_dir: exports
  backups_dir: backups

upload:
  max_file_mb: 50
  allowed_code_ext: [.zip, .py, .java, .js, .ts, .cpp, .c, .cs, .go, .rs, .php, .rb, .html, .css]
  allowed_document_ext: [.docx, .pdf, .txt, .md, .xlsx]
  allowed_testcase_ext: [.xlsx]

database:
  backend: sqlite
  sqlite_path: ../storage/daily_report.sqlite3
  # Future:
  # backend: postgres
  # dsn_env: DAILY_REPORT_DATABASE_URL

llm_judge:
  enabled: false
  provider: openai_compatible
  base_url: http://127.0.0.1:8080
  chat_path: /v1/chat/completions
  # Same directory as this config.yaml (project config/ or mounted backend/config/).
  api_key_file: llm_api_key
  api_key_env: DAILY_REPORT_LLM_API_KEY
  model: internal-model-name
  temperature: 0
  max_tokens: 1024
  max_retries: 1
  raw_log_path: ../storage/llm_raw_logs.jsonl

daily_duplicate:
  report_worker_count: 3
  self_history_days: 30
  cross_user_days: 3
  cross_user_scope: department
  max_candidates: 20
  llm_candidate_top_n: 3
  llm_candidate_score_threshold: 0.72
  low_info_candidate_score_threshold: 0.82
  no_candidate_threshold: 0.55
  score_weights:
    text: 0.45
    semantic: 0.45
    recency: 0.10

testcase_verification:
  enabled: true
  snapshot_scope: group
  baseline_strategy: latest_before_report_date
  allow_overwrite_same_day_snapshot: true
  self_history_days: 7
  self_history_high_rate: 0.50
  self_history_medium_rate: 0.20
  compare_fields:
    - 描述
    - 测试用例设计说明
    - 具体步骤
    - 期望结果

checks:
  low_information_min_length: 10
  description_too_short_length: 12
  code_history_days: 30
  code_token_similarity_threshold: 0.65
  code_token_high_risk_threshold: 0.85
  document_history_days: 30
  document_token_similarity_threshold: 0.65
  document_token_high_risk_threshold: 0.85
  enable_code_check: true
  enable_document_check: true

jplag:
  enabled: false
